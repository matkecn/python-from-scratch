[project]
name = "python-from-scratch"
version = "0.1.0"
description = "A 999 lesson course that teaches Python from the first print to building tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "python-from-scratch contributors" }]
keywords = ["python", "course", "tutorial", "learning", "examples"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Intended Audience :: Education",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyterlab>=4.0"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--doctest-modules"
testpaths = ["."]
norecursedirs = [".git", ".venv", "node_modules", "*.egg-info", ".ipynb_checkpoints"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "UP", "B", "SIM"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"*/test_*.py" = ["D100"]
